# Gateway de DESENVOLVIMENTO: uma porta só (8080) para o front falar com os dois serviços,
# que usam o mesmo prefixo /api/produtos.
#   /api/produtos/itens/{id}/precificacao[...]  -> serviço de precificação (8084)
#   todo o resto de /api/produtos/...           -> serviço de catálogo (8083)
resolver 127.0.0.11 valid=10s;   # DNS interno do Docker (permite subir em qualquer ordem)

server {
    listen 80;
    client_max_body_size 5m;

    location ~ ^/api/produtos/itens/[^/]+/precificacao {
        set $precificacao http://precificacao:8084;
        proxy_pass $precificacao;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        set $catalogo http://catalogo:8083;
        proxy_pass $catalogo;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
