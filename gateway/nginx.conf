# Gateway de desenvolvimento: uma porta só (8080) para o frontend acessar a API.
resolver 127.0.0.11 valid=10s;   # DNS interno do Docker (permite subir em qualquer ordem)

server {
    listen 80;
    client_max_body_size 5m;

    location / {
        set $catalogo http://catalogo:8083;
        proxy_pass $catalogo;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
