  "info": {
    "title": "Catálogo de produtos, fabricantes e distribuidores",
    "version": "0.4.0",
    "description": "Contrato dos 15 endpoints do catálogo. Não inclui escrita de precificação nem consulta pública por QR Code, pendente de acordo com a plataforma. Permissões no claim perms. tenant_id e sub de usuários são UUIDs; o tenant não é recebido no corpo nem na query."
