  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "schemas": {
      "ErroCampo": {
        "type": "object",
        "properties": {
          "campo": {
            "type": "string",
            "nullable": true
          },
          "codigo": {
            "type": "string"
          },
          "detalhe": {
            "type": "string"
          }
        },
        "required": [
          "campo",
          "codigo",
          "detalhe"
        ]
      },
      "Erro": {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean"
          },
          "data": {
            "type": "object",
            "nullable": true
          },
          "message": {
            "type": "string",
            "nullable": true
          },
          "errors": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ErroCampo"
            }
          }
        },
        "required": [
          "success",
          "data",
          "message",
          "errors"
        ]
      },
      "ItemCriacao": {
        "type": "object",
        "properties": {
          "sku": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64,
            "description": "Obrigatório; espaços externos removidos e convertido para maiúsculas. Único por tenant, inclusive itens inativos."
          },
          "nome": {
            "type": "string",
            "minLength": 1,
            "description": "Não pode conter somente espaços."
          },
          "fabricanteId": {
            "type": "string",
            "format": "uuid",
            "nullable": true
          },
          "distribuidorId": {
            "type": "string",
            "format": "uuid",
            "nullable": true
          },
          "categoria": {
            "type": "string",
            "enum": [
              "SOFTWARE",
              "LICENÇA",
              "SERVIÇO",
              "PROJETO",
              "CONSULTORIA",
              "BACKUP",
              "ARMAZENAMENTO",
              "CLOUD",
              "SEGURANÇA",
              "ANTIVÍRUS",
              "EDR",
              "XDR",
              "MICROSOFT 365",
              "GOOGLE WORKSPACE",
              "SUPORTE",
              "OUTROS"
            ]
          },
          "descricao": {
            "type": "string",
            "nullable": true
          },
          "unidade": {
            "type": "string",
            "enum": [
              "USUARIO",
              "LICENCA",
              "ENDPOINT",
              "SERVIDOR",
              "VM",
              "GB",
              "TB",
              "CAIXA_POSTAL",
              "DOMINIO",
              "HORA",
              "UNIDADE"
            ]
          },
          "periodicidade": {
            "type": "string",
            "enum": [
              "UNICA",
              "MENSAL",
              "TRIMESTRAL",
              "SEMESTRAL",
              "ANUAL"
            ]
          },
          "quantidadeMinima": {
            "type": "string",
            "pattern": "^-?[0-9]+(\\.[0-9]+)?$",
            "description": "String decimal com ponto, positiva e até 11 dígitos inteiros. GB, TB e HORA aceitam até 4 casas decimais significativas; demais unidades somente inteiros.",
            "example": "1"
          },
          "ativo": {
            "type": "boolean",
            "default": true
          },
          "imagemUrl": {
            "type": "string",
            "nullable": true,
            "maxLength": 2048,
            "description": "URL HTTP/HTTPS com host, sem credenciais. Null ou string vazia remove a imagem."
          }
        },
        "additionalProperties": false,
        "required": [
          "sku",
          "nome",
          "categoria",
          "unidade",
          "periodicidade",
          "quantidadeMinima"
        ]
      },
