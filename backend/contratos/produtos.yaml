            "name": "pagina",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 0,
              "default": 0
            }
          },
          {
            "name": "tamanho",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          },
          {
            "name": "ordenar",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "nome,asc",
                "nome,desc"
              ],
              "default": "nome,asc"
            }
          },
          {
            "name": "q",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "categoria",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "SOFTWARE",
                "LICENÇA",
                "SERVIÇO",
                "PROJETO",
                "CONSULTORIA",
                "BACKUP",
                "ARMAZENAMENTO",
                "CLOUD",
                "SEGURANÇA",
                "ANTIVÍRUS",
                "EDR",
                "XDR",
                "MICROSOFT 365",
                "GOOGLE WORKSPACE",
                "SUPORTE",
                "OUTROS"
              ]
            }
          },
          {
            "name": "fabricanteId",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
