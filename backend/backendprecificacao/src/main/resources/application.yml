server:
  port: ${PORT:8084}

spring:
  application:
    name: produtos-precificacao

  # Mesmo banco/schema do serviço de catálogo (tabelas compartilhadas em "produtos").
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/integrador}
    username: ${DB_USER:own_produtos}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: produtos
        format_sql: true
        jdbc.time_zone: UTC
    show-sql: ${SHOW_SQL:false}

  # Quem cria e altera o schema é o serviço de catálogo (V1, V2, V3).
  # Os dois rodando Flyway no mesmo schema quebrariam o histórico de migrations.
  flyway:
    enabled: false

# Mesmas variáveis do serviço de catálogo. Só são lidas fora do profile "local".
produtos:
  jwt:
    issuer: ${JWT_ISSUER}
    jwk-set-uri: ${JWT_JWKS_URI}
    audience: ${JWT_AUDIENCE}
    permissions-claim: ${JWT_PERMISSIONS_CLAIM:permissions}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200}

springdoc:
  api-docs:
    path: /api/produtos/v3/api-docs
  swagger-ui:
    path: /api/produtos/swagger-ui.html

logging:
  level:
    br.edu.pi2026.produtos: ${LOG_LEVEL:INFO}
