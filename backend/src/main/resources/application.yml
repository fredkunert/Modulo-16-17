server:
  port: ${PORT:8083}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/integrador}
    username: ${DB_USER:own_produtos}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    schemas: produtos
    default-schema: produtos
  jackson:
    default-property-inclusion: always
produtos:
  jwt:
    issuer: ${JWT_ISSUER}
    jwk-set-uri: ${JWT_JWKS_URI}
    audience: ${JWT_AUDIENCE}
    permissions-claim: ${JWT_PERMISSIONS_CLAIM:permissions}
