spring:
  datasource:
    url: jdbc:h2:mem:catalogo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS produtos
    username: sa
    password: ''
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
produtos:
  jwt:
    issuer: https://auth.test
    jwk-set-uri: https://auth.test/jwks
    audience: produtos
    permissions-claim: permissions
