name: centinela-produtos

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: integrador
      POSTGRES_USER: own_produtos
      POSTGRES_PASSWORD: ${DB_PASSWORD:-produtos_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U own_produtos -d integrador"]
      interval: 5s
      timeout: 3s
      retries: 10

  catalogo:
    image: centinela/produtos-api:local
    profiles: [app]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/integrador
      DB_USER: own_produtos
      DB_PASSWORD: ${DB_PASSWORD:-produtos_dev}
      JWT_ISSUER: ${JWT_ISSUER:-http://identity.local}
      JWT_JWKS_URI: ${JWT_JWKS_URI:-http://identity:8081/api/identity/.well-known/jwks.json}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-produtos}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:4200}
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/api/produtos/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway:
    image: nginx:alpine
    profiles: [app]
    depends_on:
      - catalogo
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

volumes:
  pgdata:
